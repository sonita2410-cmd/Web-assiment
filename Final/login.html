<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | The Gen Collection</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Header -->
    <header class="navbar">

        <div class="menu">
            <a href="index.html">← BACK</a>
        </div>

        <div class="logo">
            <h1>THE GEN COLLECTION</h1>
        </div>

        <div class="nav-right">
            <a href="index.html">HOME</a>
            <a href="cart.html">CART</a>
        </div>

    </header>


    <!-- Login -->
    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-title">

                <p>WELCOME BACK</p>

                <h2>LOGIN</h2>

                <span>
                    Sign in to continue shopping with us.
                </span>

            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="remember-row">

                    <label>
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    LOGIN
                </button>

            </form>

            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create Account
                    </a>
                </p>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="footer">

        <div class="copyright">

            <p>
                © 2026 The Gen Collection.
                All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="All.js"></script>

</body>

</html>
